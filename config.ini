# ytdl-bridge settings. Every setting lives here.
#
# To keep your own values, put them in config_local.ini (same format, only the
# lines you want to change). It is gitignored and read after this file, so
# pulling updates never overwrites it.
#
# Changes apply on the next download. No browser restart needed.

[folders]
# Where downloads go. ~ is expanded.
music_dir = ~/Music
video_dir = ~/Videos
# Name of the "flat default" folder created inside each of the two above.
flat_folder = yt-rips

[browser]
# Browser yt-dlp reads your YouTube login cookies from. Anything yt-dlp's
# --cookies-from-browser accepts: brave, chrome, chromium, edge, firefox,
# opera, vivaldi, safari, or BROWSER:PROFILE (for example chrome:Profile 1).
# Set to "none" to run without cookies (no age-restricted or private videos).
cookies_from = brave

[download]
# yt-dlp format selectors.
audio_format = bestaudio[abr=128]/bestaudio
video_format = bestvideo+bestaudio/best
# Playlists run in batches of this many items. yt-dlp reads cookies once per
# process, and in testing they went stale after about 13-14 items.
batch_size = 10
# yt-dlp's cache is wiped every N downloads.
cache_wipe_every = 10

[lyrics]
# Fetch and embed lyrics after each audio download (needs the mutagen and
# syncedlyrics Python packages).
enabled = true

[sync]
# Optional: copy music_dir to an Android phone over USB (needs jmtpfs and
# rsync). Run from the extension's right-click menu or: bash scripts/sync.sh
# Where the phone gets mounted while syncing.
mount_point = ~/phone
# Folder on the phone to copy into, relative to the mount point.
phone_dir = Internal shared storage/Music
# true = also delete songs on the phone that are no longer in music_dir (mirror).
delete = true
